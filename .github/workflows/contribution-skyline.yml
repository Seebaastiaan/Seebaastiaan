name: Refresh contribution skyline

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-skyline
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'Seebaastiaan/Seebaastiaan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Generate skyline from public contribution counts
        run: python3 scripts/contribution_skyline.py Seebaastiaan
      - name: Compose full cream README
        run: python3 scripts/compose_readme.py
      - name: Commit updated graph and source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-skyline.svg assets/contributions.json assets/readme-cream.svg assets/link-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution skyline'
            git push
          fi
